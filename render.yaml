services:
  - type: web
    name: gruhalakshmi-pdf-generator
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: gruhalakshmi-postgres
          property: connectionString
      - key: ADMIN_PIN
        generateValue: true

databases:
  - name: gruhalakshmi-postgres
    plan: free
    region: oregon
    databaseName: phone_download
    user: gruhalakshmi_user
